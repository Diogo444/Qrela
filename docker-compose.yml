version: '3.8'

services:
  qrela:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Qrela
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - caddy_net
      - qrela-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  qrela-network:
    driver: bridge
  caddy_net:
    external: true
